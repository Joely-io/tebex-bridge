name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version` here: pnpm/action-setup reads it from package.json's
      # `packageManager` and refuses to run when both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
